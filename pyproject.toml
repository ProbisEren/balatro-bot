[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balatro-ai"
version = "0.0.1"
description = "Balatro'yu mümkün olan en iyi oynayan otonom bot"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "gymnasium>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["balatro_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
